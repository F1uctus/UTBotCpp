---
name: Windows

# A native Windows build of the server and the CLI: MSVC ABI, no WSL, MSYS or
# Cygwin in the toolchain or the result.
#
# The job builds KLEE from the submodule as well, because the distribution has
# to carry the KLEE it was built against -- the server spawns klee.exe rather
# than linking it, and the two have to agree on the bitcode version and on the
# option set.
#
# Prebuilt LLVM is linked rather than built: building LLVM and Clang from source
# does not fit in an Actions budget.

on:
  push:
    branches:
      - win-native
      - 'ci/**'
  pull_request:
    branches:
      - win-native
      - main
  workflow_dispatch:

env:
  # Has to match the KLEE side: LLVM reads bitcode from its own version or
  # older, never newer, and the server, KLEE and the bundled clang all handle
  # the same bitcode.
  LLVM_VERSION: 22.1.8
  Z3_VERSION: 4.16.0

defaults:
  run:
    shell: pwsh

jobs:
  build:
    name: x86-64 native
    runs-on: windows-2022
    timeout-minutes: 300

    steps:
      - name: Check out UTBotCpp
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Check out the submodules the build needs
        run: |
          # Not --recursive: Bear is a POSIX build-interception tool that does
          # not apply here, and it is the largest of them.
          foreach ($module in @('submodules/klee', 'submodules/loguru',
                                'submodules/json', 'submodules/ordered-map',
                                'submodules/parallel-hashmap')) {
            git submodule update --init --depth 1 $module
            if ($LASTEXITCODE -ne 0) { throw "checking out $module failed" }
          }

      - name: Set up the MSVC toolchain
        run: |
          # vcvars64.bat is the only supported way to get a working MSVC
          # environment, and it only speaks cmd. Run it, ask cmd for the
          # resulting environment, and replay that into the job so every later
          # step inherits the linker and the CRT.
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          if (-not (Test-Path -LiteralPath $vswhere)) {
            throw "vswhere.exe not found at $vswhere"
          }
          $vsPath = & $vswhere -latest -products '*' `
            -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 `
            -property installationPath
          if (-not $vsPath) { throw 'No Visual Studio install with the C++ toolchain' }
          $vcvars = Join-Path $vsPath 'VC\Auxiliary\Build\vcvars64.bat'
          Write-Host "Using $vcvars"

          $lines = & "${env:COMSPEC}" /s /c "`"$vcvars`" >nul 2>&1 && set"
          if ($LASTEXITCODE -ne 0) { throw "vcvars64.bat failed ($LASTEXITCODE)" }

          $count = 0
          foreach ($line in $lines) {
            if ($line -notmatch '^([^=]+)=(.*)$') { continue }
            $name = $Matches[1]
            $value = $Matches[2]
            if ($name -match '^(GITHUB_|RUNNER_|ACTIONS_|INPUT_)') { continue }
            "$name=$value" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
            $count++
          }
          Write-Host "Exported $count environment variables"

      - name: Exclude the build directories from Defender
        run: |
          # The LLVM release unpacks to ~3.9 GB across 4741 files, most of them
          # small headers, and every one is scanned as it is written. The runner
          # is disposable and the inputs are signed releases fetched over TLS.
          $deps = Join-Path (Split-Path -Parent $env:GITHUB_WORKSPACE) 'deps'
          New-Item -ItemType Directory -Path $deps -Force | Out-Null
          foreach ($path in @($deps, $env:GITHUB_WORKSPACE, $env:TEMP)) {
            try {
              Add-MpPreference -ExclusionPath $path -ErrorAction Stop
              Write-Host "Excluded $path"
            } catch {
              Write-Host "::warning::Could not exclude ${path}: $($_.Exception.Message)"
            }
          }

      - name: Cache the unpacked LLVM
        id: llvm-unpacked-cache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}\..\deps\llvm
          key: llvm-unpacked-${{ env.LLVM_VERSION }}-x86_64-pc-windows-msvc-v1

      - name: Cache the LLVM tarball
        id: llvm-cache
        if: steps.llvm-unpacked-cache.outputs.cache-hit != 'true'
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}\..\deps\llvm.tar.xz
          key: llvm-${{ env.LLVM_VERSION }}-x86_64-pc-windows-msvc

      - name: Download the LLVM release
        if: steps.llvm-unpacked-cache.outputs.cache-hit != 'true' && steps.llvm-cache.outputs.cache-hit != 'true'
        run: |
          $deps = Join-Path (Split-Path -Parent $env:GITHUB_WORKSPACE) 'deps'
          New-Item -ItemType Directory -Path $deps -Force | Out-Null
          $name = "clang+llvm-${env:LLVM_VERSION}-x86_64-pc-windows-msvc.tar.xz"
          $url = "https://github.com/llvm/llvm-project/releases/download/" +
                 "llvmorg-${env:LLVM_VERSION}/" + [uri]::EscapeDataString($name)
          Write-Host "Fetching $url"
          curl.exe --fail --location --silent --show-error `
            --retry 8 --retry-delay 20 --retry-max-time 900 --retry-all-errors `
            --output (Join-Path $deps 'llvm.tar.xz') $url

      - name: Unpack LLVM
        if: steps.llvm-unpacked-cache.outputs.cache-hit != 'true'
        timeout-minutes: 30
        run: |
          $deps = Join-Path (Split-Path -Parent $env:GITHUB_WORKSPACE) 'deps'
          $root = Join-Path $deps 'llvm'
          New-Item -ItemType Directory -Path $root -Force | Out-Null

          # bsdtar decompresses and writes in one pass and is very slow here.
          # 7-Zip, which the runner image ships, is markedly faster: the xz
          # stream is decoded into one sequential write and only then expanded.
          $sevenZip = Get-Command 7z.exe -ErrorAction SilentlyContinue
          $started = Get-Date
          if ($sevenZip) {
            $tar = Join-Path $deps 'llvm.tar'
            & $sevenZip.Path x (Join-Path $deps 'llvm.tar.xz') "-o$deps" -y -bso0 -bsp0
            if ($LASTEXITCODE -ne 0) { throw "7z xz stage failed ($LASTEXITCODE)" }
            & $sevenZip.Path x $tar "-o$root" -y -bso0 -bsp0
            if ($LASTEXITCODE -ne 0) { throw "7z tar stage failed ($LASTEXITCODE)" }
            Remove-Item -LiteralPath $tar -Force

            # 7z keeps the archive's single top-level directory, which tar's
            # --strip-components=1 would have removed.
            $inner = Get-ChildItem -LiteralPath $root -Directory |
                     Where-Object { $_.Name -like 'clang+llvm-*' }
            if ($inner) {
              Get-ChildItem -LiteralPath $inner.FullName -Force |
                Move-Item -Destination $root
              Remove-Item -LiteralPath $inner.FullName -Recurse -Force
            }
          } else {
            tar.exe -x -f (Join-Path $deps 'llvm.tar.xz') -C $root --strip-components=1
            if ($LASTEXITCODE -ne 0) { throw "unpacking LLVM failed ($LASTEXITCODE)" }
          }
          Write-Host ("Unpacked in {0:N1} minutes" -f ((Get-Date) - $started).TotalMinutes)

      - name: Locate LLVM and Clang
        run: |
          $deps = Join-Path (Split-Path -Parent $env:GITHUB_WORKSPACE) 'deps'
          $root = Join-Path $deps 'llvm'
          $llvmConfig = Join-Path $root 'lib\cmake\llvm\LLVMConfig.cmake'
          if (-not (Test-Path -LiteralPath $llvmConfig)) {
            throw "The LLVM tree at $root does not contain $llvmConfig"
          }
          # The server links clangTooling and friends, which KLEE does not, so
          # this release has to carry the Clang development package as well.
          # Checked separately and by name: without it the failure would
          # otherwise surface much later, as an unresolved external.
          $clangConfig = Join-Path $root 'lib\cmake\clang\ClangConfig.cmake'
          if (-not (Test-Path -LiteralPath $clangConfig)) {
            $libs = @(Get-ChildItem -LiteralPath (Join-Path $root 'lib') `
                        -Filter 'clang*.lib' -ErrorAction SilentlyContinue).Count
            throw ("The LLVM release does not ship the Clang CMake package " +
                   "($clangConfig missing, $libs clang*.lib present). The " +
                   "server cannot be built against it.")
          }
          "LLVM_ROOT=$root" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "LLVM and Clang at $root"

      - name: Cache Z3
        id: z3-cache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}\..\deps\z3
          key: z3-${{ env.Z3_VERSION }}-x64-win

      - name: Download and unpack Z3
        if: steps.z3-cache.outputs.cache-hit != 'true'
        run: |
          $deps = Join-Path (Split-Path -Parent $env:GITHUB_WORKSPACE) 'deps'
          $zip = Join-Path $deps 'z3.zip'
          $url = "https://github.com/Z3Prover/z3/releases/download/" +
                 "z3-${env:Z3_VERSION}/z3-${env:Z3_VERSION}-x64-win.zip"
          curl.exe --fail --location --silent --show-error `
            --retry 8 --retry-delay 20 --retry-max-time 900 --retry-all-errors --output $zip $url
          Expand-Archive -LiteralPath $zip -DestinationPath $deps -Force
          $root = Join-Path $deps "z3-${env:Z3_VERSION}-x64-win"
          Move-Item -LiteralPath $root -Destination (Join-Path $deps 'z3')
          Remove-Item -LiteralPath $zip -Force

      - name: Build SQLite3
        run: |
          # KLEE needs SQLite3 for its statistics database and Windows has no
          # system copy. The amalgamation is a single translation unit, so
          # building it here takes seconds and avoids depending on a package
          # manager's idea of which CRT it was built against -- which matters,
          # because it has to match the /MT the prebuilt LLVM forces.
          $deps = Join-Path (Split-Path -Parent $env:GITHUB_WORKSPACE) 'deps'
          $version = '3530400'
          $zip = Join-Path $deps 'sqlite.zip'
          curl.exe --fail --location --silent --show-error `
            --retry 8 --retry-delay 20 --retry-max-time 900 --retry-all-errors --output $zip `
            "https://www.sqlite.org/2026/sqlite-amalgamation-$version.zip"

          $expected = '1e71ddf93849c6a6ecf58b827c0692073d2dd7ee40196158068f7b29f422e87d'
          $actual = (Get-FileHash -LiteralPath $zip -Algorithm SHA256).Hash.ToLower()
          if ($actual -ne $expected) {
            throw "sqlite amalgamation hash mismatch`nexpected $expected`ngot      $actual"
          }

          Expand-Archive -LiteralPath $zip -DestinationPath $deps -Force
          $src = Join-Path $deps "sqlite-amalgamation-$version"

          Push-Location $src
          try {
            & "$env:LLVM_ROOT\bin\clang-cl.exe" /nologo /c /MT /O2 /DNDEBUG `
              /DSQLITE_ENABLE_COLUMN_METADATA sqlite3.c
            if ($LASTEXITCODE -ne 0) { throw 'compiling sqlite3.c failed' }
            & "$env:LLVM_ROOT\bin\llvm-lib.exe" /nologo /out:sqlite3.lib sqlite3.obj
            if ($LASTEXITCODE -ne 0) { throw 'archiving sqlite3.lib failed' }
          } finally {
            Pop-Location
          }

          "SQLITE_ROOT=$src" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "SQLite3 $version at $src"

      - name: Build and install KLEE
        timeout-minutes: 60
        run: |
          # Installed into the layout the server expects at runtime: it resolves
          # klee.exe, the runtime bitcode and klee/klee.h relative to its own
          # location, so the distribution is laid out that way from the start
          # rather than assembled at packaging time.
          $deps = Join-Path (Split-Path -Parent $env:GITHUB_WORKSPACE) 'deps'
          $prefix = Join-Path $deps 'utbot-all\install'
          $build = Join-Path $deps 'klee-build'
          cmake -S submodules/klee -B $build -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_INSTALL_PREFIX="$prefix" `
            -DCMAKE_C_COMPILER="$env:LLVM_ROOT/bin/clang-cl.exe" `
            -DCMAKE_CXX_COMPILER="$env:LLVM_ROOT/bin/clang-cl.exe" `
            -DCMAKE_POLICY_DEFAULT_CMP0091=NEW `
            -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded `
            -DLLVM_DIR="$env:LLVM_ROOT\lib\cmake\llvm" `
            -DENABLE_SOLVER_Z3=ON `
            -DZ3_INCLUDE_DIRS="$deps\z3\include" `
            -DZ3_LIBRARIES="$deps\z3\bin\libz3.lib" `
            -DSQLite3_INCLUDE_DIR="$env:SQLITE_ROOT" `
            -DSQLite3_LIBRARY="$env:SQLITE_ROOT\sqlite3.lib" `
            -DENABLE_POSIX_RUNTIME=OFF -DENABLE_KLEE_UCLIBC=OFF `
            -DENABLE_UNIT_TESTS=OFF `
            -DENABLE_SYSTEM_TESTS=OFF
          if ($LASTEXITCODE -ne 0) { throw 'configuring KLEE failed' }
          cmake --build $build --target install
          if ($LASTEXITCODE -ne 0) { throw 'building KLEE failed' }

          # The server addresses KLEE as <root>/install/bin/klee, and reads the
          # KLEE headers from <root>/install/include.
          $klee = Join-Path $prefix 'bin\klee.exe'
          if (-not (Test-Path -LiteralPath $klee)) { throw "no klee.exe at $klee" }
          New-Item -ItemType Directory -Path (Join-Path $prefix 'include') -Force | Out-Null
          Copy-Item -Recurse -Force submodules\klee\include\klee `
            (Join-Path $prefix 'include')
          "UTBOT_ALL=$(Join-Path $deps 'utbot-all')" |
            Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Lay out the toolchain the server spawns
        run: |
          # The server does not link clang or the LLVM tools, it runs them, and
          # it looks for them beside klee.exe. Copying rather than referencing
          # the unpacked release keeps the distribution self-contained.
          $prefix = Join-Path $env:UTBOT_ALL 'install'
          $bin = Join-Path $prefix 'bin'
          foreach ($tool in @('clang.exe', 'clang++.exe', 'llvm-link.exe',
                              'llvm-ar.exe', 'llvm-nm.exe', 'llvm-cov.exe',
                              'llvm-profdata.exe')) {
            $source = Join-Path $env:LLVM_ROOT "bin\$tool"
            if (-not (Test-Path -LiteralPath $source)) { throw "missing $source" }
            Copy-Item -LiteralPath $source -Destination $bin -Force
          }
          # clang needs its resource directory -- the builtin headers -- and
          # finds it relative to the binary.
          $resource = & (Join-Path $bin 'clang.exe') -print-resource-dir
          if ($LASTEXITCODE -ne 0) { throw 'clang could not report its resource dir' }
          Write-Host "clang resource dir: $resource"
          if (-not (Test-Path -LiteralPath $resource)) {
            $version = (Get-ChildItem -LiteralPath (Join-Path $env:LLVM_ROOT 'lib\clang') `
                          -Directory | Select-Object -First 1).Name
            $from = Join-Path $env:LLVM_ROOT "lib\clang\$version"
            $to = Join-Path $prefix "lib\clang\$version"
            New-Item -ItemType Directory -Path (Split-Path -Parent $to) -Force | Out-Null
            Copy-Item -Recurse -Force $from $to
            Write-Host "Copied the resource directory to $to"
          }

      - name: Cache the vcpkg downloads
        uses: actions/cache@v4
        with:
          # Separate from the packages: these survive even when a run fails
          # partway, which is what makes the next attempt cheaper.
          path: ${{ env.VCPKG_INSTALLATION_ROOT }}\downloads
          key: vcpkg-downloads-grpc-protobuf-v1

      - name: Cache the vcpkg packages
        id: vcpkg-cache
        uses: actions/cache@v4
        with:
          # The runner image ships vcpkg already, so only what gets built into
          # it is worth carrying between runs.
          path: ${{ github.workspace }}\..\deps\vcpkg-installed
          key: vcpkg-grpc-protobuf-x64-windows-v2

      - name: Build gRPC and protobuf
        timeout-minutes: 120
        run: |
          # The image's vcpkg rather than a fresh clone: cloning means
          # bootstrapping, and bootstrapping downloads vcpkg.exe, which is one
          # more network fetch to fail on -- it already has.
          #
          # gRPC has no binary distribution for MSVC, so it is built once and
          # the installed tree is cached. This is the long pole of a cold run.
          $deps = Join-Path (Split-Path -Parent $env:GITHUB_WORKSPACE) 'deps'
          $cached = Join-Path $deps 'vcpkg-installed'
          $vcpkg = $env:VCPKG_INSTALLATION_ROOT
          if (-not $vcpkg -or -not (Test-Path -LiteralPath $vcpkg)) {
            throw "no vcpkg on this image (VCPKG_INSTALLATION_ROOT=$vcpkg)"
          }
          Write-Host "Using vcpkg at $vcpkg"

          if (Test-Path -LiteralPath (Join-Path $cached 'x64-windows')) {
            Write-Host 'Restoring the cached packages'
            Copy-Item -Recurse -Force (Join-Path $cached '*') (Join-Path $vcpkg 'installed')
          } else {
            # Retried: every failure here so far has been a download, not a
            # build -- vcpkg fetching its own ninja, or the release CDN
            # refusing. An hour-long build should not be discarded for one of
            # them.
            # Five attempts two minutes apart. Every failure here has been a
            # download rather than a build -- the archive CDN answering 503 to
            # this runner for minutes at a time -- and vcpkg keeps what it has
            # already fetched, so an attempt resumes rather than restarts.
            $installed = $false
            foreach ($attempt in 1..5) {
              & (Join-Path $vcpkg 'vcpkg.exe') install grpc:x64-windows protobuf:x64-windows
              if ($LASTEXITCODE -eq 0) { $installed = $true; break }
              Write-Host "::warning::vcpkg install attempt $attempt failed"
              Start-Sleep -Seconds 120
            }
            if (-not $installed) { throw 'installing grpc failed after 5 attempts' }
            New-Item -ItemType Directory -Path $cached -Force | Out-Null
            Copy-Item -Recurse -Force (Join-Path $vcpkg 'installed\*') $cached
          }
          "VCPKG_ROOT_DIR=$vcpkg" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Fetch CLI11
        run: |
          $deps = Join-Path (Split-Path -Parent $env:GITHUB_WORKSPACE) 'deps'
          $cli = Join-Path $deps 'cli11'
          New-Item -ItemType Directory -Path $cli -Force | Out-Null
          curl.exe --fail --location --silent --show-error `
            --retry 8 --retry-delay 20 --retry-max-time 900 --retry-all-errors `
            --output (Join-Path $cli 'CLI11.hpp') `
            'https://github.com/CLIUtils/CLI11/releases/download/v2.4.2/CLI11.hpp'
          "CLI_PATH=$cli" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Report the toolchain
        run: |
          & (Join-Path $env:LLVM_ROOT 'bin\clang.exe') --version
          & (Join-Path $env:UTBOT_ALL 'install\bin\klee.exe') --version
          cmake --version
          Write-Host "UTBOT_ALL=$env:UTBOT_ALL"

      - name: Configure
        run: |
          $vcpkg = $env:VCPKG_ROOT_DIR
          cmake -S server -B build -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_TOOLCHAIN_FILE="$vcpkg\scripts\buildsystems\vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET=x64-windows `
            -DCMAKE_C_COMPILER="$env:LLVM_ROOT/bin/clang-cl.exe" `
            -DCMAKE_CXX_COMPILER="$env:LLVM_ROOT/bin/clang-cl.exe" `
            -DCMAKE_POLICY_DEFAULT_CMP0091=NEW `
            -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded `
            -DLLVM_DIR="$env:LLVM_ROOT\lib\cmake\llvm" `
            -DClang_DIR="$env:LLVM_ROOT\lib\cmake\clang" `
            -DENABLE_UNIT_TESTS=OFF `
            -DUTBOT_DEV_ROOT_DIR=
          if ($LASTEXITCODE -ne 0) { throw 'configuring the server failed' }

      - name: Build
        timeout-minutes: 90
        run: |
          cmake --build build --target utbot
          if ($LASTEXITCODE -ne 0) { throw 'building the server failed' }

      - name: Check the import surface
        run: |
          # The point of the exercise is a native binary. Anything from a POSIX
          # emulation layer here means something was picked up from the runner
          # that will not exist on a user's machine.
          $exe = Join-Path $env:GITHUB_WORKSPACE 'build\utbot.exe'
          if (-not (Test-Path -LiteralPath $exe)) { throw "no utbot.exe at $exe" }
          $dumpbin = Get-Command dumpbin.exe -ErrorAction SilentlyContinue
          if (-not $dumpbin) { Write-Host 'dumpbin unavailable, skipping'; exit 0 }
          $imports = & $dumpbin.Path /dependents $exe
          $imports | Write-Host
          $foreign = $imports | Select-String -Pattern 'cygwin|msys|libwinpthread'
          if ($foreign) { throw "Non-native dependency: $foreign" }

      - name: Smoke test -- KLEE end to end
        timeout-minutes: 20
        run: |
          # What the distribution can already do on Windows: compile to
          # bitcode with the bundled clang and explore it with the bundled
          # KLEE. A synthetic fixture, so the expected answer is known by
          # construction -- three branches, so three test cases.
          $fixture = Join-Path $env:RUNNER_TEMP 'fixture'
          New-Item -ItemType Directory -Path $fixture -Force | Out-Null
          @(
            '#include <klee/klee.h>',
            'int classify(int value) {',
            '    if (value > 100) return 2;',
            '    if (value > 10) return 1;',
            '    return 0;',
            '}',
            'int main(void) {',
            '    int value;',
            '    klee_make_symbolic(&value, sizeof(value), "value");',
            '    return classify(value);',
            '}'
          ) | Set-Content -LiteralPath (Join-Path $fixture 'classify.c') -Encoding ascii

          $bin = Join-Path $env:UTBOT_ALL 'install\bin'
          & (Join-Path $bin 'clang.exe') -I (Join-Path $env:UTBOT_ALL 'install\include') `
            -emit-llvm -c -g -O0 (Join-Path $fixture 'classify.c') `
            -o (Join-Path $fixture 'classify.bc')
          if ($LASTEXITCODE -ne 0) { throw 'compiling the fixture failed' }

          $out = Join-Path $fixture 'klee-out'
          & (Join-Path $bin 'klee.exe') --output-dir=$out --libc=klee `
            (Join-Path $fixture 'classify.bc')
          if ($LASTEXITCODE -ne 0) { throw "klee failed ($LASTEXITCODE)" }

          $tests = @(Get-ChildItem -LiteralPath $out -Filter '*.ktest')
          Write-Host "KLEE produced $($tests.Count) test cases"
          if ($tests.Count -lt 3) {
            throw "expected 3 cases for three branches, got $($tests.Count)"
          }

      - name: Smoke test -- the server binary runs
        run: |
          # Generation itself is not exercised here yet. Its compile steps now
          # run as processes and its recipes are written in the shell that will
          # read them, but the link step still goes through make.
          #
          # That one is not a translation job. The root module is linked twice:
          # once without stubs, then again after the missing symbols have been
          # stubbed, and the stub list reaches the second link as the make
          # variable $(STUB_BITCODE_FILES), defined by a makefile the first pass
          # writes. Running the link directly means materialising that list in
          # the server and re-planning the second pass, not just spelling the
          # recipe differently.
          #
          # Until then this checks what is true: the binary links, starts, and
          # reports its interface.
          $utbot = Join-Path $env:GITHUB_WORKSPACE 'build\utbot.exe'
          $help = & $utbot --help 2>&1 | Out-String
          if ($LASTEXITCODE -ne 0) { throw "utbot --help failed ($LASTEXITCODE)" }
          foreach ($expected in @('generate', 'server', '--no-ubsan')) {
            if ($help -notmatch [regex]::Escape($expected)) {
              Write-Host $help
              throw "utbot --help does not mention '$expected'"
            }
          }
          Write-Host 'utbot.exe starts and reports its interface'

      - name: Package the portable distribution
        run: |
          $stage = Join-Path $env:RUNNER_TEMP 'utbot-windows-x86_64'
          New-Item -ItemType Directory -Path (Join-Path $stage 'bin') -Force | Out-Null
          Copy-Item -LiteralPath (Join-Path $env:GITHUB_WORKSPACE 'build\utbot.exe') `
            -Destination (Join-Path $stage 'bin')

          # The whole install prefix: klee.exe, the runtime bitcode, the KLEE
          # headers the generated harness includes, and the clang and LLVM tools
          # the server spawns.
          Copy-Item -Recurse -Force (Join-Path $env:UTBOT_ALL 'install') $stage

          # Runtime DLLs. The server itself is /MT, but the vcpkg gRPC and
          # protobuf builds are shared, and Z3 is shipped as a DLL.
          $deps = Join-Path (Split-Path -Parent $env:GITHUB_WORKSPACE) 'deps'
          foreach ($dll in @(Get-ChildItem -LiteralPath "$env:VCPKG_ROOT_DIR\installed\x64-windows\bin" `
                               -Filter '*.dll' -ErrorAction SilentlyContinue)) {
            Copy-Item -LiteralPath $dll.FullName -Destination (Join-Path $stage 'bin') -Force
          }
          foreach ($dll in @(Get-ChildItem -LiteralPath "$deps\z3\bin" `
                               -Filter '*.dll' -ErrorAction SilentlyContinue)) {
            Copy-Item -LiteralPath $dll.FullName -Destination (Join-Path $stage 'install\bin') -Force
          }

          Get-ChildItem -LiteralPath $stage -Recurse -File |
            Measure-Object -Property Length -Sum |
            ForEach-Object { Write-Host ("{0} files, {1:N0} MB" -f $_.Count, ($_.Sum / 1MB)) }
          "STAGE=$stage" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Verify the distribution is relocatable
        run: |
          # Moved somewhere with no build tree and no environment: anything that
          # was resolved relative to the build directory fails here rather than
          # on a user's machine.
          $moved = Join-Path $env:RUNNER_TEMP 'relocated'
          Move-Item -LiteralPath $env:STAGE -Destination $moved
          $env:UTBOT_ALL = ''
          & (Join-Path $moved 'install\bin\klee.exe') --version
          if ($LASTEXITCODE -ne 0) { throw 'the packaged klee does not run' }
          & (Join-Path $moved 'bin\utbot.exe') --help | Out-Null
          if ($LASTEXITCODE -ne 0) { throw 'the packaged utbot does not run' }
          Move-Item -LiteralPath $moved -Destination $env:STAGE

      - name: Upload the distribution
        uses: actions/upload-artifact@v4
        with:
          name: utbot-windows-x86_64
          path: ${{ env.STAGE }}
          if-no-files-found: error
