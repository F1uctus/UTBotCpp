---
name: Windows

# A native Windows build of the server and the CLI: MSVC ABI, no WSL, MSYS or
# Cygwin in the toolchain or the result.
#
# The job builds KLEE from the submodule as well, because the distribution has
# to carry the KLEE it was built against -- the server spawns klee.exe rather
# than linking it, and the two have to agree on the bitcode version and on the
# option set.
#
# Prebuilt LLVM is linked rather than built: building LLVM and Clang from source
# does not fit in an Actions budget.

# Started by hand only. A full run sits close to the job limit, so letting every
# commit queue one burned the Actions budget on iterations that were not worth a
# Windows runner. Start it with: gh workflow run windows.yaml --ref <branch>
on:
  workflow_dispatch:

concurrency:
  # A second dispatch of the same ref supersedes the first rather than taking a
  # second Windows runner.
  group: windows-${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: true

env:
  # Has to match the KLEE side: LLVM reads bitcode from its own version or
  # older, never newer, and the server, KLEE and the bundled clang all handle
  # the same bitcode.
  LLVM_VERSION: 22.1.8
  Z3_VERSION: 4.16.0
  VCPKG_TARGET_TRIPLET: x64-windows-static-release
  VCPKG_HOST_TRIPLET: x64-windows-release

defaults:
  run:
    shell: pwsh

jobs:
  build:
    name: x86-64 native
    runs-on: windows-2022
    timeout-minutes: 360

    steps:
      - name: Check out UTBotCpp
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Check out the submodules the build needs
        run: |
          # Not --recursive: Bear is a POSIX build-interception tool that does
          # not apply here, and it is the largest of them.
          foreach ($module in @('submodules/klee', 'submodules/loguru',
                                'submodules/json', 'submodules/ordered-map',
                                'submodules/parallel-hashmap')) {
            git submodule update --init --depth 1 $module
            if ($LASTEXITCODE -ne 0) { throw "checking out $module failed" }
          }

      - name: Build the VS Code extension
        run: |
          # Early, and before the hour of C++ ahead of it: this is the half of
          # the product the user actually drives, and a mistake here should not
          # cost a full build to find out about.
          Push-Location (Join-Path $env:GITHUB_WORKSPACE 'vscode-plugin')

          # npm install rather than npm ci: package-lock.json is not tracked.
          & npm install --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { throw 'npm install failed' }

          # The client's gRPC stubs are generated from the same .proto the
          # server compiles, so the two cannot drift.
          & "${env:COMSPEC}" /c "protoc.bat ..\server\proto src\proto-ts"
          foreach ($stub in @('src\proto-ts\testgen_grpc_pb.js', 'src\proto-ts\testgen_pb.js')) {
            if (-not (Test-Path -LiteralPath $stub)) { throw "protoc produced no $stub" }
          }

          # vsce runs vscode:prepublish, which lints and type-checks, so this
          # step is also the extension's compile check.
          $vsix = Join-Path $env:RUNNER_TEMP 'utbotcpp.vsix'
          & npx --yes @vscode/vsce@latest package --out $vsix
          if ($LASTEXITCODE -ne 0) { throw 'packaging the extension failed' }
          Pop-Location

          $size = [math]::Round((Get-Item -LiteralPath $vsix).Length / 1MB, 2)
          Write-Host "Packaged the extension: $size MB"
          "EXTENSION_VSIX=$vsix" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Set up the MSVC toolchain
        run: |
          # vcvars64.bat is the only supported way to get a working MSVC
          # environment, and it only speaks cmd. Run it, ask cmd for the
          # resulting environment, and replay that into the job so every later
          # step inherits the linker and the CRT.
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          if (-not (Test-Path -LiteralPath $vswhere)) {
            throw "vswhere.exe not found at $vswhere"
          }
          $vsPath = & $vswhere -latest -products '*' `
            -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 `
            -property installationPath
          if (-not $vsPath) { throw 'No Visual Studio install with the C++ toolchain' }
          $vcvars = Join-Path $vsPath 'VC\Auxiliary\Build\vcvars64.bat'
          Write-Host "Using $vcvars"

          $lines = & "${env:COMSPEC}" /s /c "`"$vcvars`" >nul 2>&1 && set"
          if ($LASTEXITCODE -ne 0) { throw "vcvars64.bat failed ($LASTEXITCODE)" }

          $count = 0
          foreach ($line in $lines) {
            if ($line -notmatch '^([^=]+)=(.*)$') { continue }
            $name = $Matches[1]
            $value = $Matches[2]
            if ($name -match '^(GITHUB_|RUNNER_|ACTIONS_|INPUT_)') { continue }
            "$name=$value" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
            $count++
          }
          Write-Host "Exported $count environment variables"

      - name: Exclude the build directories from Defender
        run: |
          # The LLVM release unpacks to ~3.9 GB across 4741 files, most of them
          # small headers, and every one is scanned as it is written. The runner
          # is disposable and the inputs are signed releases fetched over TLS.
          $deps = Join-Path (Split-Path -Parent $env:GITHUB_WORKSPACE) 'deps'
          New-Item -ItemType Directory -Path $deps -Force | Out-Null
          foreach ($path in @($deps, $env:GITHUB_WORKSPACE, $env:TEMP)) {
            try {
              Add-MpPreference -ExclusionPath $path -ErrorAction Stop
              Write-Host "Excluded $path"
            } catch {
              Write-Host "::warning::Could not exclude ${path}: $($_.Exception.Message)"
            }
          }

      - name: Cache the unpacked LLVM
        id: llvm-unpacked-cache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}\..\deps\llvm
          key: llvm-unpacked-${{ env.LLVM_VERSION }}-x86_64-pc-windows-msvc-v1

      - name: Cache the LLVM tarball
        id: llvm-cache
        if: steps.llvm-unpacked-cache.outputs.cache-hit != 'true'
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}\..\deps\llvm.tar.xz
          key: llvm-${{ env.LLVM_VERSION }}-x86_64-pc-windows-msvc

      - name: Download the LLVM release
        if: steps.llvm-unpacked-cache.outputs.cache-hit != 'true' && steps.llvm-cache.outputs.cache-hit != 'true'
        run: |
          $deps = Join-Path (Split-Path -Parent $env:GITHUB_WORKSPACE) 'deps'
          New-Item -ItemType Directory -Path $deps -Force | Out-Null
          $name = "clang+llvm-${env:LLVM_VERSION}-x86_64-pc-windows-msvc.tar.xz"
          $url = "https://github.com/llvm/llvm-project/releases/download/" +
                 "llvmorg-${env:LLVM_VERSION}/" + [uri]::EscapeDataString($name)
          Write-Host "Fetching $url"
          curl.exe --fail --location --silent --show-error `
            --retry 8 --retry-delay 20 --retry-max-time 900 --retry-all-errors `
            --output (Join-Path $deps 'llvm.tar.xz') $url

      - name: Unpack LLVM
        if: steps.llvm-unpacked-cache.outputs.cache-hit != 'true'
        timeout-minutes: 30
        run: |
          $deps = Join-Path (Split-Path -Parent $env:GITHUB_WORKSPACE) 'deps'
          $root = Join-Path $deps 'llvm'
          New-Item -ItemType Directory -Path $root -Force | Out-Null

          # bsdtar decompresses and writes in one pass and is very slow here.
          # 7-Zip, which the runner image ships, is markedly faster: the xz
          # stream is decoded into one sequential write and only then expanded.
          $sevenZip = Get-Command 7z.exe -ErrorAction SilentlyContinue
          $started = Get-Date
          if ($sevenZip) {
            $tar = Join-Path $deps 'llvm.tar'
            & $sevenZip.Path x (Join-Path $deps 'llvm.tar.xz') "-o$deps" -y -bso0 -bsp0
            if ($LASTEXITCODE -ne 0) { throw "7z xz stage failed ($LASTEXITCODE)" }
            & $sevenZip.Path x $tar "-o$root" -y -bso0 -bsp0
            if ($LASTEXITCODE -ne 0) { throw "7z tar stage failed ($LASTEXITCODE)" }
            Remove-Item -LiteralPath $tar -Force

            # 7z keeps the archive's single top-level directory, which tar's
            # --strip-components=1 would have removed.
            $inner = Get-ChildItem -LiteralPath $root -Directory |
                     Where-Object { $_.Name -like 'clang+llvm-*' }
            if ($inner) {
              Get-ChildItem -LiteralPath $inner.FullName -Force |
                Move-Item -Destination $root
              Remove-Item -LiteralPath $inner.FullName -Recurse -Force
            }
          } else {
            tar.exe -x -f (Join-Path $deps 'llvm.tar.xz') -C $root --strip-components=1
            if ($LASTEXITCODE -ne 0) { throw "unpacking LLVM failed ($LASTEXITCODE)" }
          }
          Write-Host ("Unpacked in {0:N1} minutes" -f ((Get-Date) - $started).TotalMinutes)

      - name: Locate LLVM and Clang
        run: |
          $deps = Join-Path (Split-Path -Parent $env:GITHUB_WORKSPACE) 'deps'
          $root = Join-Path $deps 'llvm'
          $llvmConfig = Join-Path $root 'lib\cmake\llvm\LLVMConfig.cmake'
          if (-not (Test-Path -LiteralPath $llvmConfig)) {
            throw "The LLVM tree at $root does not contain $llvmConfig"
          }
          # The server links clangTooling and friends, which KLEE does not, so
          # this release has to carry the Clang development package as well.
          # Checked separately and by name: without it the failure would
          # otherwise surface much later, as an unresolved external.
          $clangConfig = Join-Path $root 'lib\cmake\clang\ClangConfig.cmake'
          if (-not (Test-Path -LiteralPath $clangConfig)) {
            $libs = @(Get-ChildItem -LiteralPath (Join-Path $root 'lib') `
                        -Filter 'clang*.lib' -ErrorAction SilentlyContinue).Count
            throw ("The LLVM release does not ship the Clang CMake package " +
                   "($clangConfig missing, $libs clang*.lib present). The " +
                   "server cannot be built against it.")
          }
          "LLVM_ROOT=$root" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "LLVM and Clang at $root"

      - name: Cache Z3
        id: z3-cache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}\..\deps\z3
          key: z3-${{ env.Z3_VERSION }}-x64-win

      - name: Download and unpack Z3
        if: steps.z3-cache.outputs.cache-hit != 'true'
        run: |
          $deps = Join-Path (Split-Path -Parent $env:GITHUB_WORKSPACE) 'deps'
          $zip = Join-Path $deps 'z3.zip'
          $url = "https://github.com/Z3Prover/z3/releases/download/" +
                 "z3-${env:Z3_VERSION}/z3-${env:Z3_VERSION}-x64-win.zip"
          curl.exe --fail --location --silent --show-error `
            --retry 8 --retry-delay 20 --retry-max-time 900 --retry-all-errors --output $zip $url
          Expand-Archive -LiteralPath $zip -DestinationPath $deps -Force
          $root = Join-Path $deps "z3-${env:Z3_VERSION}-x64-win"
          Move-Item -LiteralPath $root -Destination (Join-Path $deps 'z3')
          Remove-Item -LiteralPath $zip -Force

      - name: Build SQLite3
        run: |
          # KLEE needs SQLite3 for its statistics database and Windows has no
          # system copy. The amalgamation is a single translation unit, so
          # building it here takes seconds and avoids depending on a package
          # manager's idea of which CRT it was built against -- which matters,
          # because it has to match the /MT the prebuilt LLVM forces.
          $deps = Join-Path (Split-Path -Parent $env:GITHUB_WORKSPACE) 'deps'
          $version = '3530400'
          $zip = Join-Path $deps 'sqlite.zip'
          curl.exe --fail --location --silent --show-error `
            --retry 8 --retry-delay 20 --retry-max-time 900 --retry-all-errors --output $zip `
            "https://www.sqlite.org/2026/sqlite-amalgamation-$version.zip"

          $expected = '1e71ddf93849c6a6ecf58b827c0692073d2dd7ee40196158068f7b29f422e87d'
          $actual = (Get-FileHash -LiteralPath $zip -Algorithm SHA256).Hash.ToLower()
          if ($actual -ne $expected) {
            throw "sqlite amalgamation hash mismatch`nexpected $expected`ngot      $actual"
          }

          Expand-Archive -LiteralPath $zip -DestinationPath $deps -Force
          $src = Join-Path $deps "sqlite-amalgamation-$version"

          Push-Location $src
          try {
            & "$env:LLVM_ROOT\bin\clang-cl.exe" /nologo /c /MT /O2 /DNDEBUG `
              /DSQLITE_ENABLE_COLUMN_METADATA sqlite3.c
            if ($LASTEXITCODE -ne 0) { throw 'compiling sqlite3.c failed' }
            & "$env:LLVM_ROOT\bin\llvm-lib.exe" /nologo /out:sqlite3.lib sqlite3.obj
            if ($LASTEXITCODE -ne 0) { throw 'archiving sqlite3.lib failed' }
          } finally {
            Pop-Location
          }

          "SQLITE_ROOT=$src" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "SQLite3 $version at $src"

      - name: Build and install KLEE
        timeout-minutes: 60
        run: |
          # Installed into the layout the server expects at runtime: it resolves
          # klee.exe, the runtime bitcode and klee/klee.h relative to its own
          # location, so the distribution is laid out that way from the start
          # rather than assembled at packaging time.
          $deps = Join-Path (Split-Path -Parent $env:GITHUB_WORKSPACE) 'deps'
          $prefix = Join-Path $deps 'utbot-all\install'
          $build = Join-Path $deps 'klee-build'
          cmake -S submodules/klee -B $build -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_INSTALL_PREFIX="$prefix" `
            -DCMAKE_C_COMPILER="$env:LLVM_ROOT/bin/clang-cl.exe" `
            -DCMAKE_CXX_COMPILER="$env:LLVM_ROOT/bin/clang-cl.exe" `
            -DCMAKE_POLICY_DEFAULT_CMP0091=NEW `
            -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded `
            -DLLVM_DIR="$env:LLVM_ROOT\lib\cmake\llvm" `
            -DENABLE_SOLVER_Z3=ON `
            -DZ3_INCLUDE_DIRS="$deps\z3\include" `
            -DZ3_LIBRARIES="$deps\z3\bin\libz3.lib" `
            -DSQLite3_INCLUDE_DIR="$env:SQLITE_ROOT" `
            -DSQLite3_LIBRARY="$env:SQLITE_ROOT\sqlite3.lib" `
            -DENABLE_POSIX_RUNTIME=OFF -DENABLE_KLEE_UCLIBC=OFF `
            -DENABLE_UNIT_TESTS=OFF `
            -DENABLE_SYSTEM_TESTS=OFF `
            -DKLEE_RUNTIME_BUILD_TYPE=Release
          if ($LASTEXITCODE -ne 0) { throw 'configuring KLEE failed' }
          cmake --build $build --target install
          if ($LASTEXITCODE -ne 0) { throw 'building KLEE failed' }

          # The server addresses KLEE as <root>/install/bin/klee, and reads the
          # KLEE headers from <root>/install/include.
          $klee = Join-Path $prefix 'bin\klee.exe'
          if (-not (Test-Path -LiteralPath $klee)) { throw "no klee.exe at $klee" }
          New-Item -ItemType Directory -Path (Join-Path $prefix 'include') -Force | Out-Null
          Copy-Item -Recurse -Force submodules\klee\include\klee `
            (Join-Path $prefix 'include')
          $runtimeDir = Join-Path $prefix 'lib\klee\runtime'
          foreach ($architecture in @('64', 'arm32')) {
            $runtime = @(Get-ChildItem -LiteralPath $runtimeDir `
                           -Filter "*${architecture}_Release.bca" -File `
                           -ErrorAction SilentlyContinue)
            if (-not $runtime) {
              throw "no Release runtime bitcode for $architecture under $runtimeDir"
            }
          }
          # The installed executable is run below, before the distribution is
          # assembled. Keep its solver and CRT dependencies beside it now;
          # otherwise Report the toolchain only works when a matching Z3 is
          # accidentally present on the runner's PATH.
          foreach ($dll in @(Get-ChildItem -LiteralPath "$deps\z3\bin" `
                               -Filter '*.dll' -File -ErrorAction SilentlyContinue)) {
            Copy-Item -LiteralPath $dll.FullName -Destination (Join-Path $prefix 'bin') -Force
          }
          if (-not (Test-Path -LiteralPath (Join-Path $prefix 'bin\libz3.dll'))) {
            throw 'the installed KLEE tree contains no libz3.dll'
          }
          "UTBOT_ALL=$(Join-Path $deps 'utbot-all')" |
            Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Put llvm-link beside KLEE
        run: |
          # The one tool the server still takes from the release it was built
          # against. Everything else it spawns compiles the user's code and so
          # comes from the mingw toolchain instead; llvm-link only merges
          # bitcode, which does not care what a module was compiled for, and
          # llvm-mingw ships no llvm-link at all.
          $bin = Join-Path $env:UTBOT_ALL 'install\bin'
          $source = Join-Path $env:LLVM_ROOT 'bin\llvm-link.exe'
          if (-not (Test-Path -LiteralPath $source)) { throw "missing $source" }
          Copy-Item -LiteralPath $source -Destination $bin -Force

      - name: Assemble the build tools the distribution carries
        run: |
          # UTBot hands the user makefiles to build and run the tests it wrote,
          # and their recipes are POSIX: mkdir -p, mv -f, rm -rf, and
          # "cmd && { cmd; exit $?; }". Windows supplies none of that, so the
          # distribution carries its own make and its own shell instead of
          # asking for MSYS or Cygwin on the target machine.
          $bin = Join-Path $env:UTBOT_ALL 'bin'
          New-Item -ItemType Directory -Path $bin -Force | Out-Null
          $deps = Join-Path (Split-Path -Parent $env:GITHUB_WORKSPACE) 'deps'
          New-Item -ItemType Directory -Path $deps -Force | Out-Null

          # --- GNU make, built here with the same MSVC as the server ---
          $makeVer = 'make-4.4.1'
          $tarball = Join-Path $deps "$makeVer.tar.gz"
          if (-not (Test-Path -LiteralPath $tarball)) {
            Invoke-WebRequest -Uri "https://ftp.gnu.org/gnu/make/$makeVer.tar.gz" `
              -OutFile $tarball -UseBasicParsing
          }
          $makeSrc = Join-Path $deps $makeVer
          if (-not (Test-Path -LiteralPath $makeSrc)) {
            # 7-Zip rather than tar.exe, for the same reason the LLVM release
            # uses it: bsdtar is pathologically slow on this runner.
            & 7z.exe x $tarball "-o$deps" -y -bso0 -bsp0
            if ($LASTEXITCODE -ne 0) { throw 'decompressing make failed' }
            & 7z.exe x (Join-Path $deps "$makeVer.tar") "-o$deps" -y -bso0 -bsp0
            if ($LASTEXITCODE -ne 0) { throw 'unpacking make failed' }
            Remove-Item -LiteralPath (Join-Path $deps "$makeVer.tar") -Force
          }
          Push-Location $makeSrc
          # build_w32.bat defaults to cl.exe and to a 64-bit release build.
          # Guile only adds a scripting extension nothing here uses.
          & "${env:COMSPEC}" /c "build_w32.bat --without-guile"
          $buildStatus = $LASTEXITCODE
          Pop-Location
          $builtMake = Join-Path $makeSrc 'WinRel\gnumake.exe'
          if (-not (Test-Path -LiteralPath $builtMake)) {
            throw "building make failed ($buildStatus)"
          }
          Copy-Item -LiteralPath $builtMake -Destination (Join-Path $bin 'make.exe') -Force

          # --- busybox as the POSIX shell and coreutils ---
          # Pinned to a versioned file name: the unversioned busybox64.exe is
          # overwritten in place on every upstream release, so it cannot be
          # checksummed usefully.
          $bbFile = 'busybox-w64-FRP-6075-g169694ebd.exe'
          $bbSha = '07bb1e5b095b00d68a695481f9240879f33c5724b40aa2308f999d54ed78f075'
          $bbPath = Join-Path $deps $bbFile
          if (-not (Test-Path -LiteralPath $bbPath)) {
            Invoke-WebRequest -Uri "https://frippery.org/files/busybox/$bbFile" `
              -OutFile $bbPath -UseBasicParsing
          }
          $actual = (Get-FileHash -LiteralPath $bbPath -Algorithm SHA256).Hash.ToLower()
          if ($actual -ne $bbSha) { throw "busybox checksum: expected $bbSha, got $actual" }
          Copy-Item -LiteralPath $bbPath -Destination (Join-Path $bin 'busybox.exe') -Force
          # busybox chooses its applet from argv[0], so a copy per name is what
          # makes "mkdir -p" in a recipe resolve. sh.exe carries a second job:
          # make reads the shell's name to decide whether to quote recipes the
          # Unix way, and only recognises the usual ones.
          foreach ($applet in @('sh', 'mkdir', 'mv', 'rm', 'cp', 'cat', 'echo', 'test')) {
            Copy-Item -LiteralPath $bbPath -Destination (Join-Path $bin "$applet.exe") -Force
          }

          # --- gtest and access_private, as sources ---
          # The generated makefiles compile gtest-all.cc and gtest_main.cc
          # themselves, so the source tree is all that has to be shipped.
          $gtest = Join-Path $env:UTBOT_ALL 'gtest'
          if (-not (Test-Path -LiteralPath $gtest)) {
            & git clone --quiet --depth 1 --branch release-1.10.0 `
              https://github.com/google/googletest.git $gtest
            if ($LASTEXITCODE -ne 0) { throw 'cloning googletest failed' }
          }
          $accessPrivate = Join-Path $env:UTBOT_ALL 'access_private'
          if (-not (Test-Path -LiteralPath $accessPrivate)) {
            & git clone --quiet --depth 1 `
              https://github.com/martong/access_private.git $accessPrivate
            if ($LASTEXITCODE -ne 0) { throw 'cloning access_private failed' }
          }

          # --- prove the pieces work together before anything depends on them ---
          & (Join-Path $bin 'make.exe') --version | Select-Object -First 1
          if ($LASTEXITCODE -ne 0) { throw 'the built make does not run' }
          $probe = Join-Path $env:RUNNER_TEMP 'shellprobe'
          Remove-Item -LiteralPath $probe -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path $probe -Force | Out-Null
          $recipe = @(
            'mkdir -p one/two && echo made > one/two/a',
            'mv -f one/two/a one/two/b',
            'test -f one/two/b && echo shell-ok',
            'rm -rf one'
          ) -join ' && '
          $out = & (Join-Path $bin 'sh.exe') -c "cd '$($probe -replace '\\', '/')' && $recipe"
          if ($LASTEXITCODE -ne 0 -or $out -notmatch 'shell-ok') {
            throw "the bundled shell cannot run a generated recipe: $out"
          }
          Write-Host 'make, sh and the POSIX applets are in place'

          # --- the toolchain the user's code is compiled with ---
          # Not the clang from the clang+llvm-*-windows-msvc release the server
          # links: that one targets the MSVC ABI, and its headers and import
          # libraries belong to Visual Studio, which LLVM cannot redistribute.
          # A machine without Visual Studio cannot compile #include <stdio.h>
          # with it, which would make "portable" untrue in the one way that
          # matters.
          #
          # llvm-mingw is the same LLVM 22.1.8 built for mingw-w64, carrying
          # its own CRT, libc++ and headers. The version has to match: KLEE
          # reads bitcode from its own LLVM or older, and this is that LLVM.
          $mingwTag = '20260616'
          $mingwName = "llvm-mingw-$mingwTag-ucrt-x86_64"
          $mingwZip = Join-Path $deps "$mingwName.zip"
          if (-not (Test-Path -LiteralPath $mingwZip)) {
            Invoke-WebRequest -UseBasicParsing -OutFile $mingwZip `
              -Uri "https://github.com/mstorsjo/llvm-mingw/releases/download/$mingwTag/$mingwName.zip"
          }
          $mingwRoot = Join-Path $deps $mingwName
          if (-not (Test-Path -LiteralPath $mingwRoot)) {
            & 7z.exe x $mingwZip "-o$deps" -y -bso0 -bsp0
            if ($LASTEXITCODE -ne 0) { throw 'unpacking llvm-mingw failed' }
          }
          $toolchain = Join-Path $env:UTBOT_ALL 'toolchain'
          if (-not (Test-Path -LiteralPath $toolchain)) {
            Copy-Item -Recurse -Force $mingwRoot $toolchain
            # clang resolves its sysroot relative to itself, so the tree stays
            # whole -- but only for the one architecture that is being built
            # for, and without the parts that debug or lint rather than build.
            foreach ($unused in @('aarch64-w64-mingw32', 'armv7-w64-mingw32',
                                   'arm64ec-w64-mingw32', 'i686-w64-mingw32',
                                   'python', 'busybox')) {
              Remove-Item -LiteralPath (Join-Path $toolchain $unused) `
                -Recurse -Force -ErrorAction SilentlyContinue
            }
            foreach ($pattern in @('lldb*', 'clangd*', 'clang-tidy*', 'clang-format*',
                                    'liblldb*', 'libpython*')) {
              Get-ChildItem -LiteralPath (Join-Path $toolchain 'bin') -Filter $pattern `
                -ErrorAction SilentlyContinue | Remove-Item -Force -ErrorAction SilentlyContinue
            }
          }
          $mingwClang = Join-Path $toolchain 'bin\x86_64-w64-mingw32-clang.exe'
          if (-not (Test-Path -LiteralPath $mingwClang)) {
            throw 'the toolchain has no x86_64-w64-mingw32-clang.exe'
          }
          & $mingwClang --version | Select-Object -First 2
          "UTBOT_TOOLCHAIN_CLANG=$mingwClang" |
            Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "UTBOT_TOOLCHAIN=$toolchain" |
            Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

          # --- CMake and Ninja, for importing the user's own project ---
          # A clean Windows has neither, and the generator CMake would pick by
          # default there is Visual Studio, which writes no
          # compile_commands.json. Both go in the install prefix, where the
          # server looks for the tools it spawns.
          $installBin = Join-Path $env:UTBOT_ALL 'install\bin'
          $cmakeVer = '4.4.2'
          $cmakeZip = Join-Path $deps "cmake-$cmakeVer-windows-x86_64.zip"
          if (-not (Test-Path -LiteralPath $cmakeZip)) {
            Invoke-WebRequest -UseBasicParsing -OutFile $cmakeZip `
              -Uri "https://github.com/Kitware/CMake/releases/download/v$cmakeVer/cmake-$cmakeVer-windows-x86_64.zip"
          }
          $cmakeRoot = Join-Path $deps "cmake-$cmakeVer-windows-x86_64"
          if (-not (Test-Path -LiteralPath $cmakeRoot)) {
            & 7z.exe x $cmakeZip "-o$deps" -y -bso0 -bsp0
            if ($LASTEXITCODE -ne 0) { throw 'unpacking CMake failed' }
          }
          # bin and share both: cmake reads its own modules out of share, and
          # finds them relative to the executable.
          foreach ($part in @('bin', 'share')) {
            Copy-Item -Recurse -Force (Join-Path $cmakeRoot $part) `
              (Join-Path $env:UTBOT_ALL 'install')
          }

          $ninjaZip = Join-Path $deps 'ninja-win.zip'
          if (-not (Test-Path -LiteralPath $ninjaZip)) {
            Invoke-WebRequest -UseBasicParsing -OutFile $ninjaZip `
              -Uri 'https://github.com/ninja-build/ninja/releases/download/v1.13.2/ninja-win.zip'
          }
          & 7z.exe x $ninjaZip "-o$installBin" -y -bso0 -bsp0
          if ($LASTEXITCODE -ne 0) { throw 'unpacking Ninja failed' }

          & (Join-Path $installBin 'cmake.exe') --version | Select-Object -First 1
          if ($LASTEXITCODE -ne 0) { throw 'the bundled cmake does not run' }
          & (Join-Path $installBin 'ninja.exe') --version
          if ($LASTEXITCODE -ne 0) { throw 'the bundled ninja does not run' }

      - name: Restore the vcpkg downloads
        id: vcpkg-downloads-cache
        uses: actions/cache/restore@v4
        with:
          # Separate from the packages: these survive even when a run fails
          # partway, which is what makes the next attempt cheaper.
          path: ${{ github.workspace }}\.vcpkg-downloads
          key: vcpkg-downloads-grpc-protobuf-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            vcpkg-downloads-grpc-protobuf-v1-

      - name: Restore the vcpkg binary cache
        id: vcpkg-binary-cache
        uses: actions/cache/restore@v4
        with:
          # The installed tree is more than 20 GiB, whereas vcpkg's compressed
          # binary archives are small enough for the Actions cache. Complete
          # ports restored from here are installed without recompilation.
          path: ${{ github.workspace }}\.vcpkg-binary-cache
          key: vcpkg-binary-windows-${{ hashFiles('.github/vcpkg-manifest/vcpkg.json', '.github/vcpkg-triplets/*.cmake') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            vcpkg-binary-windows-${{ hashFiles('.github/vcpkg-manifest/vcpkg.json', '.github/vcpkg-triplets/*.cmake') }}-
            vcpkg-binary-windows-

      - name: Build gRPC and protobuf
        id: grpc-build
        # Let the cache-saving steps below run after a compiler error or a
        # timeout. The explicit gate after them restores the failed job status.
        continue-on-error: true
        timeout-minutes: 240
        env:
          VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}\.vcpkg-binary-cache
          VCPKG_DOWNLOADS: ${{ github.workspace }}\.vcpkg-downloads
        run: |
          # The image's vcpkg rather than a fresh clone: cloning means
          # bootstrapping, and bootstrapping downloads vcpkg.exe, which is one
          # more network fetch to fail on -- it already has.
          #
          # gRPC has no binary distribution for MSVC, so it is built once and
          # the installed tree is cached. This is the long pole of a cold run.
          $vcpkg = $env:VCPKG_INSTALLATION_ROOT
          if (-not $vcpkg -or -not (Test-Path -LiteralPath $vcpkg)) {
            throw "no vcpkg on this image (VCPKG_INSTALLATION_ROOT=$vcpkg)"
          }
          Write-Host "Using vcpkg at $vcpkg"

          $installedRoot = Join-Path $env:GITHUB_WORKSPACE '.vcpkg-installed'
          $manifestRoot = Join-Path $env:GITHUB_WORKSPACE '.github\vcpkg-manifest'
          $overlayTriplets = Join-Path $env:GITHUB_WORKSPACE '.github\vcpkg-triplets'
          foreach ($cachePath in @($env:VCPKG_DEFAULT_BINARY_CACHE,
                                   $env:VCPKG_DOWNLOADS)) {
            New-Item -ItemType Directory -Path $cachePath -Force | Out-Null
          }
          $grpcConfig = Join-Path $installedRoot `
            "$env:VCPKG_TARGET_TRIPLET\share\grpc\gRPCConfig.cmake"
          if (Test-Path -LiteralPath $grpcConfig) {
            Write-Host "Using the cached packages at $grpcConfig"
          } else {
            # Retried: every failure here so far has been a download, not a
            # build -- vcpkg fetching its own ninja, or the release CDN
            # refusing. An hour-long build should not be discarded for one of
            # them.
            # Five attempts two minutes apart. Every failure here has been a
            # download rather than a build -- the archive CDN answering 503 to
            # this runner for minutes at a time -- and vcpkg keeps what it has
            # already fetched, so an attempt resumes rather than restarts.
            $installed = $false
            foreach ($attempt in 1..5) {
              & (Join-Path $vcpkg 'vcpkg.exe') install `
                "--x-manifest-root=$manifestRoot" `
                "--triplet=$env:VCPKG_TARGET_TRIPLET" `
                "--host-triplet=$env:VCPKG_HOST_TRIPLET" `
                "--overlay-triplets=$overlayTriplets" `
                "--x-install-root=$installedRoot"
              if ($LASTEXITCODE -eq 0) { $installed = $true; break }
              Write-Host "::warning::vcpkg install attempt $attempt failed"
              Start-Sleep -Seconds 120
            }
            if (-not $installed) { throw 'installing grpc failed after 5 attempts' }
          }
          "VCPKG_ROOT_DIR=$vcpkg" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "VCPKG_INSTALLED_DIR=$installedRoot" |
            Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "VCPKG_OVERLAY_TRIPLETS=$overlayTriplets" |
            Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Save the vcpkg binary cache
        if: always() && steps.vcpkg-binary-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ github.workspace }}\.vcpkg-binary-cache
          key: vcpkg-binary-windows-${{ hashFiles('.github/vcpkg-manifest/vcpkg.json', '.github/vcpkg-triplets/*.cmake') }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Save the vcpkg downloads
        if: always() && steps.vcpkg-downloads-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ github.workspace }}\.vcpkg-downloads
          key: vcpkg-downloads-grpc-protobuf-v1-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Require a complete gRPC installation
        if: always()
        run: |
          if ('${{ steps.grpc-build.outcome }}' -ne 'success') {
            throw 'The gRPC build failed; its completed ports were preserved for the next run'
          }
          $grpcConfig = Join-Path $env:GITHUB_WORKSPACE `
            ".vcpkg-installed\$env:VCPKG_TARGET_TRIPLET\share\grpc\gRPCConfig.cmake"
          if (-not (Test-Path -LiteralPath $grpcConfig)) {
            throw "gRPC reported success but $grpcConfig is missing"
          }

      - name: Fetch CLI11
        run: |
          $deps = Join-Path (Split-Path -Parent $env:GITHUB_WORKSPACE) 'deps'
          $cli = Join-Path $deps 'cli11'
          New-Item -ItemType Directory -Path $cli -Force | Out-Null
          curl.exe --fail --location --silent --show-error `
            --retry 8 --retry-delay 20 --retry-max-time 900 --retry-all-errors `
            --output (Join-Path $cli 'CLI11.hpp') `
            'https://github.com/CLIUtils/CLI11/releases/download/v2.4.2/CLI11.hpp'
          curl.exe --fail --location --silent --show-error `
            --retry 8 --retry-delay 20 --retry-max-time 900 --retry-all-errors `
            --output (Join-Path $cli 'rang.hpp') `
            'https://github.com/agauniyal/rang/releases/download/v3.1.0/rang.hpp'
          "CLI_PATH=$cli" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Report the toolchain
        run: |
          & (Join-Path $env:LLVM_ROOT 'bin\clang.exe') --version
          & (Join-Path $env:UTBOT_ALL 'install\bin\klee.exe') --version
          cmake --version
          Write-Host "UTBOT_ALL=$env:UTBOT_ALL"

      - name: Configure
        run: |
          $vcpkg = $env:VCPKG_ROOT_DIR
          cmake -S server -B build -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_TOOLCHAIN_FILE="$vcpkg\scripts\buildsystems\vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET="$env:VCPKG_TARGET_TRIPLET" `
            -DVCPKG_HOST_TRIPLET="$env:VCPKG_HOST_TRIPLET" `
            -DVCPKG_OVERLAY_TRIPLETS="$env:VCPKG_OVERLAY_TRIPLETS" `
            -DVCPKG_INSTALLED_DIR="$env:VCPKG_INSTALLED_DIR" `
            -DCMAKE_C_COMPILER="$env:LLVM_ROOT/bin/clang-cl.exe" `
            -DCMAKE_CXX_COMPILER="$env:LLVM_ROOT/bin/clang-cl.exe" `
            -DCMAKE_POLICY_DEFAULT_CMP0091=NEW `
            -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded `
            -DLLVM_DIR="$env:LLVM_ROOT\lib\cmake\llvm" `
            -DClang_DIR="$env:LLVM_ROOT\lib\cmake\clang" `
            -DENABLE_UNIT_TESTS=OFF `
            -DUTBOT_DEV_ROOT_DIR=
          if ($LASTEXITCODE -ne 0) { throw 'configuring the server failed' }

      - name: Build
        timeout-minutes: 90
        run: |
          cmake --build build --target utbot
          if ($LASTEXITCODE -ne 0) { throw 'building the server failed' }

      - name: Check the import surface
        run: |
          # The point of the exercise is a native binary. Anything from a POSIX
          # emulation layer here means something was picked up from the runner
          # that will not exist on a user's machine.
          $exe = Join-Path $env:GITHUB_WORKSPACE 'build\utbot.exe'
          if (-not (Test-Path -LiteralPath $exe)) { throw "no utbot.exe at $exe" }
          $dumpbin = Get-Command dumpbin.exe -ErrorAction SilentlyContinue
          if (-not $dumpbin) { Write-Host 'dumpbin unavailable, skipping'; exit 0 }
          $imports = & $dumpbin.Path /dependents $exe
          $imports | Write-Host
          $foreign = $imports | Select-String -Pattern 'cygwin|msys|libwinpthread'
          if ($foreign) { throw "Non-native dependency: $foreign" }

      - name: Smoke test -- KLEE end to end
        timeout-minutes: 20
        run: |
          # What the distribution can already do on Windows: compile to
          # bitcode with the bundled clang and explore it with the bundled
          # KLEE. A synthetic fixture, so the expected answer is known by
          # construction -- three branches, so three test cases.
          $fixture = Join-Path $env:RUNNER_TEMP 'fixture'
          New-Item -ItemType Directory -Path $fixture -Force | Out-Null
          @(
            '#include <klee/klee.h>',
            'int classify(int value) {',
            '    if (value > 100) return 2;',
            '    if (value > 10) return 1;',
            '    return 0;',
            '}',
            'int main(void) {',
            '    int value;',
            '    klee_make_symbolic(&value, sizeof(value), "value");',
            '    return classify(value);',
            '}'
          ) | Set-Content -LiteralPath (Join-Path $fixture 'classify.c') -Encoding ascii

          $bin = Join-Path $env:UTBOT_ALL 'install\bin'
          # The same clang the server spawns, so the bitcode KLEE is handed
          # here is the bitcode it will be handed in earnest.
          & $env:UTBOT_TOOLCHAIN_CLANG -I (Join-Path $env:UTBOT_ALL 'install\include') `
            -emit-llvm -c -g -O0 (Join-Path $fixture 'classify.c') `
            -o (Join-Path $fixture 'classify.bc')
          if ($LASTEXITCODE -ne 0) { throw 'compiling the fixture failed' }

          $out = Join-Path $fixture 'klee-out'
          & (Join-Path $bin 'klee.exe') --output-dir=$out --libc=klee `
            (Join-Path $fixture 'classify.bc')
          if ($LASTEXITCODE -ne 0) { throw "klee failed ($LASTEXITCODE)" }

          $tests = @(Get-ChildItem -LiteralPath $out -Filter '*.ktest')
          Write-Host "KLEE produced $($tests.Count) test cases"
          if ($tests.Count -lt 3) {
            throw "expected 3 cases for three branches, got $($tests.Count)"
          }

      - name: Smoke test -- the server binary runs
        run: |
          $utbot = Join-Path $env:GITHUB_WORKSPACE 'build\utbot.exe'
          $help = & $utbot --help-all 2>&1 | Out-String
          if ($LASTEXITCODE -ne 0) { throw "utbot --help-all failed ($LASTEXITCODE)" }
          foreach ($expected in @('generate', 'server', '--no-ubsan')) {
            if ($help -notmatch [regex]::Escape($expected)) {
              Write-Host $help
              throw "utbot --help-all does not mention '$expected'"
            }
          }
          Write-Host 'utbot.exe starts and reports its interface'

      - name: Smoke test -- generate tests
        timeout-minutes: 45
        run: |
          # Generation drives no build tool now -- it compiles, archives and
          # links by spawning the compiler itself -- so this is the first thing
          # that exercises that end to end on Windows.
          #
          # A synthetic fixture, so the expected answer is known by
          # construction: three branches, so at least three cases.
          #
          # Building and running what it generates is a separate matter and is
          # not attempted here: the test makefiles it writes for the user are
          # still makefiles, and driving those wants the same treatment the
          # generation build just had.
          $fixture = Join-Path $env:RUNNER_TEMP 'genfixture'
          New-Item -ItemType Directory -Path (Join-Path $fixture 'src') -Force | Out-Null
          @(
            'int classify(int value) {',
            '    if (value > 100) return 2;',
            '    if (value > 10) return 1;',
            '    return 0;',
            '}'
          ) | Set-Content -LiteralPath (Join-Path $fixture 'src\classify.c') -Encoding ascii
          @('int doubled(int x) { return x * 2; }') |
            Set-Content -LiteralPath (Join-Path $fixture 'src\util.c') -Encoding ascii

          $build = Join-Path $fixture 'build'
          New-Item -ItemType Directory -Path $build -Force | Out-Null
          $clang = $env:UTBOT_TOOLCHAIN_CLANG
          $ar = Join-Path $env:UTBOT_TOOLCHAIN 'bin\llvm-ar.exe'

          # A compilation database by hand: Bear intercepts exec() and does not
          # apply here, and CMake would be another moving part in a test of the
          # server. Forward slashes throughout, since these strings are read
          # back as paths rather than as PowerShell escapes.
          $compile = @()
          $link = @()
          $objects = @()
          foreach ($unit in @('classify', 'util')) {
            $source = (Join-Path $fixture "src\$unit.c") -replace '\\', '/'
            $object = (Join-Path $build "$unit.o") -replace '\\', '/'
            & $clang -c -g -O0 $source -o $object
            if ($LASTEXITCODE -ne 0) { throw "compiling $unit failed" }
            $objects += $object
            $compile += [ordered]@{
              directory = ($build -replace '\\', '/')
              command = "$($clang -replace '\\', '/') -c -g -O0 $source -o $object"
              file = $source
              output = $object
            }
          }
          $archive = (Join-Path $build 'libfixture.a') -replace '\\', '/'
          & $ar rcs $archive $objects
          if ($LASTEXITCODE -ne 0) { throw 'archiving the fixture failed' }
          $link += [ordered]@{
            directory = ($build -replace '\\', '/')
            command = "ar rcs $archive " + ($objects -join ' ')
            files = $objects
            output = $archive
          }
          ConvertTo-Json -Depth 5 -InputObject $compile |
            Set-Content -LiteralPath (Join-Path $build 'compile_commands.json') -Encoding ascii
          ConvertTo-Json -Depth 5 -InputObject $link |
            Set-Content -LiteralPath (Join-Path $build 'link_commands.json') -Encoding ascii

          # Run from the distribution layout. With UTBOT_DEV_ROOT_DIR empty,
          # the executable deliberately resolves install\bin relative to its
          # own parent; the build-tree path has no such sibling and therefore
          # cannot exercise the packaged tools.
          $runtimeBin = Join-Path $env:UTBOT_ALL 'bin'
          New-Item -ItemType Directory -Path $runtimeBin -Force | Out-Null
          $utbot = Join-Path $runtimeBin 'utbot.exe'
          Copy-Item -LiteralPath (Join-Path $env:GITHUB_WORKSPACE 'build\utbot.exe') `
            -Destination $utbot -Force
          & $utbot generate -p $fixture -b build -t tests --function-timeout 15 project
          if ($LASTEXITCODE -ne 0) { throw "utbot generate failed ($LASTEXITCODE)" }

          $generated = @(Get-ChildItem -LiteralPath $fixture -Recurse -Filter '*_test.cpp')
          if (-not $generated) { throw 'no tests were generated' }
          Write-Host "Generated: $($generated.Name -join ', ')"

          $classify = $generated | Where-Object { $_.Name -like 'classify*' } | Select-Object -First 1
          if (-not $classify) { throw 'no test file for classify' }
          $body = Get-Content -Raw -LiteralPath $classify.FullName
          $cases = ([regex]::Matches($body, 'TEST\(')).Count
          Write-Host "classify test cases: $cases"
          if ($cases -lt 3) {
            Write-Host $body
            throw "expected at least 3 cases for three branches, got $cases"
          }
          "GENERATION_FIXTURE=$fixture" |
            Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Smoke test -- import a CMake project
        timeout-minutes: 30
        run: |
          # The other fixture has its build databases written by hand. This one
          # is imported the way a user's project is: CMake configures it, and
          # the link database is derived from CMake's file API rather than from
          # Bear, which does not exist here.
          $proj = Join-Path $env:RUNNER_TEMP 'cmakefixture'
          Remove-Item -LiteralPath $proj -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path (Join-Path $proj 'src') -Force | Out-Null
          @(
            'cmake_minimum_required(VERSION 3.16)',
            'project(fixture C)',
            'add_library(shapes STATIC src/shapes.c)',
            'target_include_directories(shapes PUBLIC src)',
            'add_executable(app src/main.c)',
            'target_link_libraries(app shapes)'
          ) | Set-Content -LiteralPath (Join-Path $proj 'CMakeLists.txt') -Encoding ascii
          @(
            'int classify_side(int length) {',
            '    if (length > 100) return 2;',
            '    if (length > 10) return 1;',
            '    return 0;',
            '}'
          ) | Set-Content -LiteralPath (Join-Path $proj 'src\shapes.c') -Encoding ascii
          @(
            'int classify_side(int length);',
            'int main(void) { return classify_side(5); }'
          ) | Set-Content -LiteralPath (Join-Path $proj 'src\main.c') -Encoding ascii

          $utbot = Join-Path $env:UTBOT_ALL 'bin\utbot.exe'
          $logs = Join-Path $env:RUNNER_TEMP 'configurelogs'
          New-Item -ItemType Directory -Path $logs -Force | Out-Null
          $output = & $utbot --log $logs -v info configure -p $proj -b build 2>&1 | Out-String
          Write-Host $output
          if ($LASTEXITCODE -ne 0) { throw "utbot configure failed ($LASTEXITCODE)" }

          foreach ($database in @('compile_commands.json', 'link_commands.json')) {
            $path = Join-Path $proj "build\$database"
            if (-not (Test-Path -LiteralPath $path)) { throw "configure wrote no $database" }
            Write-Host "----- $database -----"
            Get-Content -Raw -LiteralPath $path | Write-Host
          }

          # The library and the executable both have to be in the link
          # database, or a target the user picks will not be there.
          $link = Get-Content -Raw -LiteralPath (Join-Path $proj 'build\link_commands.json') |
                  ConvertFrom-Json
          $outputs = @($link | ForEach-Object { Split-Path -Leaf $_.output })
          foreach ($expected in @('shapes', 'app')) {
            if (-not ($outputs | Where-Object { $_ -like "*$expected*" })) {
              throw "link_commands.json has no target for $expected; it has: $($outputs -join ', ')"
            }
          }

          & $utbot --log $logs -v info generate -p $proj -b build -t tests --function-timeout 15 project
          if ($LASTEXITCODE -ne 0) { throw "generating from the imported project failed ($LASTEXITCODE)" }
          $generated = @(Get-ChildItem -LiteralPath $proj -Recurse -Filter '*_test.cpp' -File)
          if (-not $generated) { throw 'the imported project generated no tests' }
          Write-Host "Generated from the CMake project: $($generated.Name -join ', ')"

      - name: Smoke test -- build and run the generated tests
        timeout-minutes: 30
        run: |
          # Generation writes makefiles for the user to build and run the tests
          # with. This is the first thing on Windows that drives them, and it
          # drives them through the make and shell the distribution carries
          # rather than through anything installed on the machine.
          $fixture = $env:GENERATION_FIXTURE
          if (-not $fixture) { throw 'the generation step recorded no fixture' }
          $utbot = Join-Path $env:UTBOT_ALL 'bin\utbot.exe'
          $logs = Join-Path $env:RUNNER_TEMP 'runlogs'
          New-Item -ItemType Directory -Path $logs -Force | Out-Null

          # Look at a generated makefile before anything runs it: without a
          # SHELL of its own make would handed these recipes to cmd.exe.
          $makefiles = @(Get-ChildItem -LiteralPath $fixture -Recurse -File |
                         Where-Object { $_.Name -like '*akefile*' -or $_.Extension -eq '.mk' })
          if (-not $makefiles) { throw 'generation produced no makefiles' }
          $sample = Get-Content -Raw -LiteralPath $makefiles[0].FullName
          if ($sample -notmatch 'SHELL\s*=') {
            Write-Host $sample
            throw "$($makefiles[0].Name) does not set SHELL"
          }
          Write-Host "Makefiles: $($makefiles.Count); checked $($makefiles[0].Name)"

          # utbot run reports a failed run by logging it, not by its exit
          # status, so the output is the thing to test.
          function Invoke-Run([string[]] $extra, [string] $what) {
            $output = & $utbot --log $logs -v info run `
              -p $fixture -b build -t tests project @extra 2>&1 | Out-String
            Write-Host $output
            if ($output -notmatch 'Successfully ran tests') {
              Get-ChildItem -LiteralPath $logs -Recurse -File -ErrorAction SilentlyContinue |
                ForEach-Object {
                  Write-Host "----- $($_.FullName) -----"
                  Get-Content -LiteralPath $_.FullName -Tail 120
                }
              throw "$what did not report a successful run"
            }
          }

          # Without coverage first: it separates a failure to build and run
          # from a failure in the coverage tooling that reads the result.
          Invoke-Run @('--no-coverage') 'utbot run --no-coverage'
          Invoke-Run @() 'utbot run with coverage'
          Write-Host 'the generated tests build, run and report coverage'

      - name: Package the portable distribution
        run: |
          $stage = Join-Path $env:RUNNER_TEMP 'utbot-windows-x86_64'
          New-Item -ItemType Directory -Path (Join-Path $stage 'bin') -Force | Out-Null
          Copy-Item -LiteralPath (Join-Path $env:GITHUB_WORKSPACE 'build\utbot.exe') `
            -Destination (Join-Path $stage 'bin')

          # The whole install prefix: klee.exe, the runtime bitcode, the KLEE
          # headers the generated harness includes, and the clang and LLVM tools
          # the server spawns.
          Copy-Item -Recurse -Force (Join-Path $env:UTBOT_ALL 'install') $stage

          # make, the shell and its applets. The generated makefiles name
          # these, so the distribution is only usable with them beside it.
          foreach ($tool in @(Get-ChildItem -LiteralPath (Join-Path $env:UTBOT_ALL 'bin') `
                                -Filter '*.exe' -File)) {
            if ($tool.Name -eq 'utbot.exe') { continue }
            Copy-Item -LiteralPath $tool.FullName -Destination (Join-Path $stage 'bin') -Force
          }

          # The toolchain that compiles the user's code, kept whole because
          # clang finds its own headers and libraries relative to itself.
          Copy-Item -Recurse -Force (Join-Path $env:UTBOT_ALL 'toolchain') $stage

          # gtest, as sources: the generated makefiles compile gtest-all.cc and
          # gtest_main.cc themselves. Only the two directories they read are
          # shipped -- the rest of the checkout is gtest's own test suite.
          $gtestTo = Join-Path $stage 'gtest\googletest'
          New-Item -ItemType Directory -Path $gtestTo -Force | Out-Null
          foreach ($part in @('include', 'src')) {
            Copy-Item -Recurse -Force `
              (Join-Path $env:UTBOT_ALL "gtest\googletest\$part") $gtestTo
          }
          Copy-Item -Force (Join-Path $env:UTBOT_ALL 'gtest\LICENSE') `
            (Join-Path $stage 'gtest')

          # access_private is header-only and is included by generated tests
          # that reach a class's private members.
          Copy-Item -Recurse -Force (Join-Path $env:UTBOT_ALL 'access_private') $stage

          # The extension, so that a machine with this directory on it has
          # both halves and needs nothing from a marketplace.
          $vscodeDir = Join-Path $stage 'vscode'
          New-Item -ItemType Directory -Path $vscodeDir -Force | Out-Null
          Copy-Item -LiteralPath $env:EXTENSION_VSIX `
            -Destination (Join-Path $vscodeDir 'utbotcpp.vsix') -Force

          # Runtime DLLs. gRPC and protobuf are linked statically with /MT to
          # match LLVM, while Z3 is shipped as a DLL.
          $deps = Join-Path (Split-Path -Parent $env:GITHUB_WORKSPACE) 'deps'
          foreach ($dll in @(Get-ChildItem -LiteralPath "$env:VCPKG_INSTALLED_DIR\$env:VCPKG_TARGET_TRIPLET\bin" `
                               -Filter '*.dll' -ErrorAction SilentlyContinue)) {
            Copy-Item -LiteralPath $dll.FullName -Destination (Join-Path $stage 'bin') -Force
          }
          foreach ($dll in @(Get-ChildItem -LiteralPath "$deps\z3\bin" `
                               -Filter '*.dll' -ErrorAction SilentlyContinue)) {
            Copy-Item -LiteralPath $dll.FullName -Destination (Join-Path $stage 'install\bin') -Force
          }
          # The Z3 release carries the MSVC redistributable DLLs that KLEE's
          # own portable package uses. gRPC/protobuf need the same runtime, so
          # put those beside utbot.exe too; Windows does not search the sibling
          # install\bin directory while loading the server.
          foreach ($runtime in @('msvcp140.dll', 'msvcp140_1.dll',
                                  'msvcp140_2.dll', 'msvcp140_atomic_wait.dll',
                                  'msvcp140_codecvt_ids.dll', 'vcruntime140.dll',
                                  'vcruntime140_1.dll', 'vcruntime140_threads.dll')) {
            $source = Join-Path "$deps\z3\bin" $runtime
            if (-not (Test-Path -LiteralPath $source)) {
              $source = Join-Path $env:SystemRoot "System32\$runtime"
            }
            if (Test-Path -LiteralPath $source) {
              Copy-Item -LiteralPath $source -Destination (Join-Path $stage 'bin') -Force
            }
          }

          foreach ($required in @('bin\utbot.exe', 'install\bin\klee.exe',
                                   'install\bin\llvm-link.exe',
                                   'install\bin\cmake.exe', 'install\bin\ninja.exe',
                                   'toolchain\bin\x86_64-w64-mingw32-clang.exe',
                                   'toolchain\bin\x86_64-w64-mingw32-clang++.exe',
                                   'toolchain\bin\llvm-ar.exe', 'toolchain\bin\llvm-nm.exe',
                                   'toolchain\bin\llvm-cov.exe', 'toolchain\bin\llvm-profdata.exe',
                                   'toolchain\bin\llvm-objcopy.exe', 'toolchain\bin\ld.lld.exe',
                                   'toolchain\x86_64-w64-mingw32\lib\libucrt.a',
                                   'toolchain\x86_64-w64-mingw32\lib\libc++.a',
                                   'install\include\klee\klee.h',
                                   'bin\make.exe', 'bin\sh.exe', 'bin\mkdir.exe',
                                   'bin\mv.exe', 'bin\rm.exe',
                                   'gtest\googletest\src\gtest-all.cc',
                                   'gtest\googletest\src\gtest_main.cc',
                                   'access_private\include\access_private.hpp',
                                   'vscode\utbotcpp.vsix',
                                   'bin\msvcp140.dll', 'bin\vcruntime140.dll')) {
            $path = Join-Path $stage $required
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
              throw "the distribution is missing $required"
            }
          }
          $runtimeFiles = @(Get-ChildItem -LiteralPath (Join-Path $stage 'install\lib\klee\runtime') `
                              -Filter '*_Release.bca' -File -ErrorAction SilentlyContinue)
          if (-not $runtimeFiles) {
            throw 'the distribution contains no Release KLEE runtime bitcode'
          }

          Get-ChildItem -LiteralPath $stage -Recurse -File |
            Measure-Object -Property Length -Sum |
            ForEach-Object { Write-Host ("{0} files, {1:N0} MB" -f $_.Count, ($_.Sum / 1MB)) }
          "STAGE=$stage" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Verify the distribution is relocatable
        run: |
          # Moved somewhere with no build tree and no environment: anything that
          # was resolved relative to the build directory fails here rather than
          # on a user's machine.
          $moved = Join-Path $env:RUNNER_TEMP 'relocated'
          Move-Item -LiteralPath $env:STAGE -Destination $moved
          $env:UTBOT_ALL = ''
          $savedPath = $env:PATH
          $env:PATH = "$moved\bin;$moved\install\bin;$env:SystemRoot\System32"
          & (Join-Path $moved 'install\bin\klee.exe') --version
          if ($LASTEXITCODE -ne 0) { throw 'the packaged klee does not run' }
          & (Join-Path $moved 'bin\utbot.exe') --help | Out-Null
          if ($LASTEXITCODE -ne 0) { throw 'the packaged utbot does not run' }

          # Start the server's complete generation path again after the move.
          # This resolves and spawns clang, llvm-ar, llvm-link and KLEE from the
          # relocated install tree; --help alone cannot detect a stale tool
          # root baked into the executable.
          & (Join-Path $moved 'bin\utbot.exe') generate `
            -p $env:GENERATION_FIXTURE -b build -t relocated-tests `
            --function-timeout 15 project
          if ($LASTEXITCODE -ne 0) {
            throw "the relocated distribution cannot generate tests ($LASTEXITCODE)"
          }
          $relocatedTests = @(Get-ChildItem -LiteralPath $env:GENERATION_FIXTURE `
                                -Recurse -Filter '*_test.cpp' |
                              Where-Object FullName -Like '*relocated-tests*')
          if (-not $relocatedTests) {
            throw 'the relocated distribution generated no test files'
          }
          $relocatedClassify = $relocatedTests |
            Where-Object Name -Like 'classify*' | Select-Object -First 1
          if (-not $relocatedClassify) {
            throw 'the relocated distribution generated no classify test file'
          }
          $relocatedBody = Get-Content -Raw -LiteralPath $relocatedClassify.FullName
          $relocatedCases = ([regex]::Matches($relocatedBody, 'TEST\(')).Count
          Write-Host "relocated classify test cases: $relocatedCases"
          if ($relocatedCases -lt 3) {
            throw "relocated generation produced $relocatedCases cases, expected at least 3"
          }
          $env:PATH = $savedPath
          Move-Item -LiteralPath $moved -Destination $env:STAGE

      - name: Verify the distribution needs nothing from the machine
        run: |
          # The point of the whole exercise: a machine with this directory on
          # it and nothing else can compile C and C++.
          #
          # Visual Studio is installed on this runner and clang finds it
          # through the registry as well as the environment, so "clean" cannot
          # be simulated by deleting variables. What can be checked is stronger
          # anyway -- where the include paths the compiler actually chooses
          # point. A mingw-w64 target consults neither the registry nor the
          # Windows SDK, so every one of them should be inside the tree.
          $stage = $env:STAGE
          $clang = Join-Path $stage 'toolchain\bin\x86_64-w64-mingw32-clang.exe'
          $clangxx = Join-Path $stage 'toolchain\bin\x86_64-w64-mingw32-clang++.exe'
          $probe = Join-Path $env:RUNNER_TEMP 'sysrootprobe'
          Remove-Item -LiteralPath $probe -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path $probe -Force | Out-Null
          @('#include <stdio.h>', 'int main(void) { printf("hi\n"); return 0; }') |
            Set-Content -LiteralPath (Join-Path $probe 'hello.c') -Encoding ascii
          @('#include <string>', '#include <vector>', '#include <cstdio>',
            'int main() { std::vector<std::string> v{"hi"}; printf("%s\n", v[0].c_str()); return 0; }') |
            Set-Content -LiteralPath (Join-Path $probe 'hello.cpp') -Encoding ascii

          # Cleared anyway, so that a pass cannot be coming from the runner's
          # MSVC environment leaking in.
          foreach ($name in @('INCLUDE', 'LIB', 'LIBPATH', 'VCToolsInstallDir',
                               'WindowsSdkDir', 'VCINSTALLDIR', 'VSINSTALLDIR')) {
            Remove-Item -Path "env:$name" -ErrorAction SilentlyContinue
          }

          $failures = @()
          foreach ($case in @(@{ compiler = $clang;   source = 'hello.c';   out = 'hello-c.exe' },
                              @{ compiler = $clangxx; source = 'hello.cpp'; out = 'hello-cxx.exe' })) {
            $exe = Join-Path $probe $case.out
            $verbose = & $case.compiler -v (Join-Path $probe $case.source) -o $exe 2>&1 | Out-String
            if ($LASTEXITCODE -ne 0) {
              Write-Host $verbose
              $failures += "$($case.source) does not compile with only the distribution"
              continue
            }
            foreach ($line in ($verbose -split "`r?`n")) {
              $trimmed = $line.Trim()
              if ($trimmed -notmatch '^[A-Za-z]:[\\/]') { continue }
              if ($trimmed -match 'Program Files|Windows Kits|Microsoft Visual Studio') {
                $failures += "reaches outside the distribution: $trimmed"
              }
            }
            # And it has to run, not merely link: a missing runtime DLL shows
            # up here and nowhere earlier.
            $output = & $exe 2>&1 | Out-String
            if ($LASTEXITCODE -ne 0 -or $output -notmatch 'hi') {
              $failures += "$($case.out) does not run: $output"
            } else {
              Write-Host "$($case.out) built and ran with only the distribution"
            }
          }

          if ($failures) {
            $failures | Sort-Object -Unique | ForEach-Object { Write-Host "  $_" }
            throw 'the distribution is not self-contained for compiling user code'
          }
          Write-Host 'C and C++ both compile, link and run from the distribution alone'

      - name: Upload the distribution
        uses: actions/upload-artifact@v4
        with:
          name: utbot-win64-llvm${{ env.LLVM_VERSION }}
          path: ${{ env.STAGE }}
          if-no-files-found: error
          retention-days: 30
